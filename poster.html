<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>生活圈 · Johome 新功能海报</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;background:#DFE4EC;display:flex;flex-direction:column;align-items:center;padding:16px 12px 40px}
.bar{display:flex;gap:7px;margin-bottom:14px;flex-wrap:wrap;justify-content:center}
.btn{border:1px solid #C2CDDD;background:#fff;color:#3B4A63;border-radius:99px;padding:7px 15px;font-size:12px;cursor:pointer}
.btn:hover{border-color:#1E63DE;color:#1E63DE}
.btn.on{background:#16233C;border-color:#16233C;color:#fff}
.stage{transform-origin:top center}
.poster{width:540px;height:960px;position:relative;overflow:hidden;background:#0A1A33;color:#fff;box-shadow:0 20px 60px rgba(10,26,51,.35)}
.poster .pad{position:absolute;left:52px;right:52px;top:52px;bottom:44px;display:flex;flex-direction:column}
.brand{display:flex;align-items:center;justify-content:space-between;font-size:13px;letter-spacing:3px;opacity:.85}
.brand .nw{border:1px solid currentColor;border-radius:99px;padding:3px 12px;font-size:11px;letter-spacing:2px}
.eyebrow{margin-top:76px;font-size:13px;letter-spacing:6px;opacity:.6}
h1{margin-top:16px;font-size:74px;line-height:1.06;font-weight:800;letter-spacing:2px}
h1 em{font-style:normal;color:#FFD24A}
.rule{width:56px;height:4px;background:#FFD24A;margin:26px 0 20px}
.sub{font-size:17px;line-height:1.75;opacity:.86;font-weight:300;max-width:330px}
.sub b{font-weight:600;opacity:1}
html[lang=en] .sub{max-width:392px;font-size:16px;line-height:1.7}
.art{flex:1;position:relative;margin:0 -12px;min-height:0;overflow:hidden}
.art>svg{position:absolute;top:0;left:0;width:100%;height:100%}
.nums{display:flex;gap:0;border-top:1px solid rgba(255,255,255,.22);padding-top:20px}
.nums div{flex:1}
.nums b{display:block;font-size:38px;font-weight:800;line-height:1;letter-spacing:-1px}
.nums span{font-size:12px;opacity:.62;letter-spacing:1px;display:block;margin-top:7px}
.foot{display:flex;align-items:flex-end;justify-content:space-between;margin-top:22px}
.foot .site{font-size:13px;letter-spacing:1px;opacity:.9}
.foot .dis{font-size:9.5px;opacity:.42;text-align:right;line-height:1.6;max-width:200px}
/* light variant */
.poster.light{background:#F4F1EA;color:#16233C}
.poster.light h1 em{color:#1E63DE}
.poster.light .rule{background:#1E63DE}
.poster.light .nums{border-color:rgba(22,35,60,.18)}
.poster.light .brand,.poster.light .eyebrow,.poster.light .sub,.poster.light .nums span,.poster.light .foot .dis{opacity:.72}
/* bold variant */
.poster.bold{background:linear-gradient(160deg,#1B49C6 0%,#2E7BE8 48%,#6B4DF0 100%)}
.poster.bold h1 em{color:#FFE58A}
.poster.bold .rule{background:#FFE58A}
</style>
</head>
<body>
<div class="bar">
  <button class="btn on" data-v="dark">深蓝</button>
  <button class="btn" data-v="light">米白</button>
  <button class="btn" data-v="bold">渐变</button>
  <button class="btn" id="bLang">EN</button>
  <button class="btn" id="bDl">⬇ 下载 1080×1920</button>
</div>
<div class="stage" id="stage"><div class="poster" id="poster"></div></div>
<script src="data.js?v=20260828e"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>
(function(){
  var cTot=Object.keys(JH.CITYCARD).length,zTot=0,nbTot=0,k;
  for(k in JH.ZONES){zTot++;nbTot+=JH.ZONES[k].nbs.length;}
  var C={
    zh:{nw:'新功能',eyebrow:'JOHOME 区域找房',h1:['找房','先看懂','<em>那一片</em>'],
        sub:'<b>生活圈</b>：本地人口中的「那一片」——<br/>几个相邻社区连成一圈，跨市也算。<br/>现在，可以直接按圈找房。',
        nums:[[cTot,'城市'],[zTot,'生活圈'],[nbTot,'MLS 社区']],
        site:'johome.com · 区域找房',
        dis:'数据示意，历史涨幅不代表未来；以官方最新数据为准',
        artA:'一个生活圈',artB:'跨市也算'},
    en:{nw:'NEW',eyebrow:'JOHOME AREA FINDER',h1:['Start','with the','<em>area</em>'],
        sub:'<b>Lifestyle zones</b>: the areas locals actually name — neighbouring communities in one circle, city lines crossed where life does.',
        nums:[[cTot,'CITIES'],[zTot,'ZONES'],[nbTot,'NEIGHBOURHOODS']],
        site:'johome.com · Area Finder',
        dis:'Illustrative data; past growth does not indicate future results',
        artA:'one lifestyle zone',artB:'crosses city lines'}
  };
  var lang='zh',variant='dark';
  var ACC={dark:'#FFD24A',light:'#1E63DE',bold:'#FFE58A'};
  function art(d,ac){
    var dots='',seed=7,i,pts=[[250,150],[318,120],[196,206],[300,218],[372,182],[236,272],[318,286],[150,258],[386,262],[268,346],[196,330],[352,344],[112,196],[420,214]];
    for(i=0;i<pts.length;i++){
      var inZone=Math.sqrt(Math.pow(pts[i][0]-268,2)+Math.pow(pts[i][1]-246,2))<132;
      dots+='<circle cx="'+pts[i][0]+'" cy="'+pts[i][1]+'" r="'+(inZone?5.5:4)+'" fill="'+(inZone?ac:'currentColor')+'" opacity="'+(inZone?'1':'.28')+'"/>';
    }
    return '<svg viewBox="0 0 536 420" width="100%" height="100%" style="color:currentColor">'
      +'<path d="M60 96 C 150 60, 210 190, 300 150 S 470 120, 500 40" fill="none" stroke="currentColor" stroke-opacity=".26" stroke-width="1.5" stroke-dasharray="7 7"/>'
      +'<path d="M40 300 C 140 268, 190 372, 300 336 S 460 352, 512 300" fill="none" stroke="currentColor" stroke-opacity=".26" stroke-width="1.5" stroke-dasharray="7 7"/>'
      +'<circle cx="268" cy="246" r="132" fill="'+ac+'" fill-opacity=".10" stroke="'+ac+'" stroke-width="2"/>'
      +'<circle cx="268" cy="246" r="176" fill="none" stroke="currentColor" stroke-opacity=".16" stroke-width="1"/>'
      +dots
      +'<text x="268" y="252" text-anchor="middle" font-size="15" letter-spacing="2" fill="'+ac+'" font-family="inherit">'+d.artA+'</text>'
      +'<text x="512" y="318" text-anchor="end" font-size="11.5" letter-spacing="1" fill="currentColor" opacity=".5" font-family="inherit">'+d.artB+'</text>'
      +'</svg>';
  }
  function render(){
    var d=C[lang],p=document.getElementById('poster');
    p.className='poster'+(variant==='dark'?'':' '+variant);
    p.innerHTML='<div class="pad">'
      +'<div class="brand"><span>JOHOME</span><span class="nw">'+d.nw+'</span></div>'
      +'<div class="eyebrow">'+d.eyebrow+'</div>'
      +'<h1>'+d.h1.join('<br/>')+'</h1>'
      +'<div class="rule"></div>'
      +'<div class="sub">'+d.sub+'</div>'
      +'<div class="art">'+art(d,ACC[variant])+'</div>'
      +'<div class="nums">'+d.nums.map(function(n){return '<div><b>'+n[0]+'</b><span>'+n[1]+'</span></div>';}).join('')+'</div>'
      +'<div class="foot"><div class="site">'+d.site+'</div><div class="dis">'+d.dis+'</div></div>'
      +'</div>';
    document.documentElement.lang=lang;
    document.getElementById('bLang').textContent=lang==='zh'?'EN':'中文';
    fit();
  }
  function fit(){
    var s=Math.min(1,(Math.min(window.innerWidth,900)-28)/540);
    var st=document.getElementById('stage');
    st.style.transform='scale('+s+')';
    st.style.height=(960*s)+'px';
  }
  Array.prototype.forEach.call(document.querySelectorAll('.btn[data-v]'),function(b){
    b.onclick=function(){
      variant=b.getAttribute('data-v');
      Array.prototype.forEach.call(document.querySelectorAll('.btn[data-v]'),function(x){x.className='btn'+(x===b?' on':'');});
      render();
    };
  });
  document.getElementById('bLang').onclick=function(){lang=(lang==='zh'?'en':'zh');render();};
  document.getElementById('bDl').onclick=function(){
    var btn=this,old=btn.textContent,st=document.getElementById('stage'),tr=st.style.transform;
    if(!window.html2canvas){btn.textContent='✕';setTimeout(function(){btn.textContent=old;},1500);return;}
    btn.textContent='…';st.style.transform='scale(1)';
    html2canvas(document.getElementById('poster'),{scale:2,backgroundColor:null,useCORS:true}).then(function(cv){
      var a=document.createElement('a');a.download='johome-lifestyle-zone-poster.png';a.href=cv.toDataURL('image/png');a.click();
      st.style.transform=tr;btn.textContent=old;
    }).catch(function(){st.style.transform=tr;btn.textContent='✕';setTimeout(function(){btn.textContent=old;},1500);});
  };
  window.addEventListener('resize',fit);
  render();
})();
</script>
</body>
</html>
