<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>生活圈 · Johome 新功能海报</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;background:#DFE4EC;display:flex;flex-direction:column;align-items:center;padding:16px 12px 40px}
.bar{display:flex;gap:7px;margin-bottom:14px;flex-wrap:wrap;justify-content:center}
.btn{border:1px solid #C2CDDD;background:#fff;color:#3B4A63;border-radius:99px;padding:7px 15px;font-size:12px;cursor:pointer}
.btn:hover{border-color:#1E63DE;color:#1E63DE}
.btn.on{background:#16233C;border-color:#16233C;color:#fff}
.stage{transform-origin:top center}
.poster{--acc:#FFD24A;--fg:#fff;--mute:rgba(255,255,255,.62);--line:rgba(255,255,255,.18);--card:rgba(255,255,255,.07);--cardb:rgba(255,255,255,.14);
  width:540px;height:1200px;position:relative;overflow:hidden;background:#0A1A33;color:var(--fg);box-shadow:0 20px 60px rgba(10,26,51,.35)}
.poster.light{--acc:#1E63DE;--fg:#16233C;--mute:rgba(22,35,60,.6);--line:rgba(22,35,60,.16);--card:#fff;--cardb:#E3E0D6;background:#F4F1EA}
.poster.bold{--acc:#FFE58A;background:linear-gradient(165deg,#1B49C6 0%,#2E7BE8 50%,#6B4DF0 100%)}
.pad{position:absolute;left:46px;right:46px;top:44px;bottom:38px;display:flex;flex-direction:column}
.brand{display:flex;align-items:center;justify-content:space-between;font-size:12.5px;letter-spacing:3px;opacity:.85}
.brand .nw{border:1px solid currentColor;border-radius:99px;padding:3px 12px;font-size:10.5px;letter-spacing:2px}
.eyebrow{margin-top:40px;font-size:12px;letter-spacing:5px;color:var(--mute)}
h1{margin-top:12px;font-size:56px;line-height:1.1;font-weight:800;letter-spacing:1px}
h1 em{font-style:normal;color:var(--acc)}
.lead{margin-top:16px;font-size:15px;line-height:1.7;color:var(--mute);max-width:420px}
.lead b{color:var(--fg);font-weight:600}
.art{height:230px;position:relative;margin:6px -10px 0;overflow:hidden}
.art>svg{position:absolute;top:0;left:0;width:100%;height:100%}
.sec{margin-top:22px}
.kick{display:flex;align-items:center;gap:10px;font-size:11px;letter-spacing:3px;color:var(--acc)}
.kick:after{content:'';flex:1;height:1px;background:var(--line)}
h2{font-size:22px;font-weight:800;margin-top:8px;line-height:1.3}
.pts{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px;margin-top:12px}
.pt{background:var(--card);border:1px solid var(--cardb);border-radius:12px;padding:12px 11px 11px}
.pt .ic{font-size:18px;line-height:1;margin-bottom:8px}
.pt b{display:block;font-size:13px;line-height:1.35;margin-bottom:4px}
.pt p{font-size:11px;line-height:1.55;color:var(--mute)}
.vals{margin-top:6px}
.val{display:flex;gap:14px;align-items:flex-start;padding:13px 0;border-bottom:1px solid var(--line)}
.val:last-child{border-bottom:0;padding-bottom:0}
.val .n{flex:none;width:30px;font-size:22px;font-weight:800;line-height:1;color:var(--acc);letter-spacing:-.5px;margin-top:1px}
.val b{display:block;font-size:14.5px;font-weight:700;line-height:1.3}
.val p{font-size:11.5px;line-height:1.6;color:var(--mute);margin-top:4px}
.cta{margin-top:auto;display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--line);padding-top:16px}
.cta .l b{display:block;font-size:15px;font-weight:700}
.cta .l span{font-size:11.5px;color:var(--mute);display:block;margin-top:3px}
.cta .go{background:var(--acc);color:#16233C;font-weight:700;font-size:12.5px;border-radius:99px;padding:9px 16px;white-space:nowrap}
.poster.light .cta .go{color:#fff}
.dis{font-size:9px;color:var(--mute);opacity:.85;margin-top:12px;line-height:1.6}
html[lang=en] h1{font-size:48px}
html[lang=en] .lead{font-size:14px;line-height:1.6}
html[lang=en] .pt p{font-size:10.3px;line-height:1.5}
html[lang=en] .lv p{font-size:10px}
html[lang=en] .lv i{font-size:12px}
</style>
</head>
<body>
<div class="bar">
  <button class="btn on" data-v="dark">深蓝</button>
  <button class="btn" data-v="light">米白</button>
  <button class="btn" data-v="bold">渐变</button>
  <button class="btn" id="bLang">EN</button>
  <button class="btn" id="bDl">⬇ 下载 1080×2400</button>
</div>
<div class="stage" id="stage"><div class="poster" id="poster"></div></div>
<script src="data.js?v=20260828e"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>
(function(){
  var cTot=Object.keys(JH.CITYCARD).length,zTot=0,nbTot=0,k;
  for(k in JH.ZONES){zTot++;nbTot+=JH.ZONES[k].nbs.length;}
  var mz=JH.ZONES['Metrotown']||{nbs:[],cities:[]};
  var mCnt=mz.nbs.length,mCities=mz.cities.join(' / ');
  var C={
    zh:{
      nw:'新功能上线',eyebrow:'JOHOME · 区域找房',
      h1:['不知道住哪？','先看懂<em>那一片</em>'],
      lead:'新上线的<b>区域找房</b>：不用先知道任何地名，也能从整个大温出发，把范围一步步缩到适合自己的那一片。',
      artA:'一个生活圈',artB:'市界穿过也不切开',
      k1:'新概念',h2a:'生活圈：本地人真正在用的地图',
      pts:[
        ['💬','按本地人的说法找','「我住铁道镇那边」——这才是大家真实的表达。生活圈就是这些「那边」，不是冷冰冰的行政区。'],
        ['🔗','跨市也算一片','Metrotown 生活圈覆盖 '+mCities+' 的 '+mCnt+' 个社区。生活范围在哪，圈就画到哪。'],
        ['📊','比城市细，比社区稳','一个市的均价掩盖了内部差异；单个社区成交又太少。生活圈的价格与涨幅，看得懂、也靠得住。']
      ],
      k2:'对你意味着什么',h2b:'少走弯路，选对那一片',
      vals:[
        ['零基础也能开始','刚来大温、对城市一无所知？从大范围看起，一步步收窄，不用先背地名，也不会漏掉本地人才知道的好地方。'],
        ['比价不再被均价带偏','同一个市里，湖边独立屋和天车口高层完全是两个价。按生活圈看价格和涨幅，对应的是真实的生活范围，而不是一个笼统的行政均值。'],
        ['先选区，再选房','先锁定适合自己的那一片，再进去看房源。方向对了，就不用一套套无效看房，把时间花在真正值得比较的选项上。']
      ],
      ctaB:'立即体验 · 区域找房',ctaS:'johome.com · 城市 / 生活圈 / 社区',go:'去看看 →',
      dis:'数据覆盖 GVR + FVREB 官方 MLS 社区对照，'+nbTot+' 个社区唯一归属、无重叠无遗漏 · 页面数据为示意，历史涨幅不代表未来表现，以官方最新数据为准'
    },
    en:{
      nw:'NEW',eyebrow:'JOHOME · AREA FINDER',
      h1:['Not sure where to live?','Start with <em>the area</em>'],
      lead:'The new <b>Area Finder</b>: start from all of Metro Vancouver and narrow down, step by step, to the area that fits you — no place names required.',
      artA:'one lifestyle zone',artB:'city lines don’t cut it',
      k1:'THE IDEA',h2a:'Lifestyle zones: the map locals actually use',
      pts:[
        ['💬','Search the way locals talk','“I live around Metrotown.” That is how people really describe home. A lifestyle zone is that “around” — not an administrative box.'],
        ['🔗','One zone, across cities','The Metrotown zone spans '+mCnt+' neighbourhoods in '+mCities+'. Where life extends, the zone follows.'],
        ['📊','Finer than a city, steadier than a block','A city average hides its own contrasts; one neighbourhood has too few sales. Zone prices and growth are readable and reliable.']
      ],
      k2:'WHAT IT MEANS FOR YOU',h2b:'Fewer detours, the right area',
      vals:[
        ['Start with zero local knowledge','New to Metro Vancouver? Begin broad and narrow step by step — no place names to memorise, and no missing the spots only locals know.'],
        ['Prices that mean something','Within one city a lakeside house and a tower by the SkyTrain are worlds apart. Zone-level prices and growth track a real living area, not an administrative average.'],
        ['Pick the area before the home','Lock in the right area first, then look at listings. With the direction set, you skip the wasted viewings and compare only what matters.']
      ],
      ctaB:'Try the Area Finder',ctaS:'johome.com · City / Zone / Neighbourhood',go:'Open →',
      dis:'Built on the official GVR + FVREB MLS sub-area mapping — '+nbTot+' neighbourhoods, one zone each, no overlap or gap · Illustrative data; past growth does not indicate future results'
    }
  };
  var lang='zh',variant='dark';
  var ACC={dark:'#FFD24A',light:'#1E63DE',bold:'#FFE58A'};
  function art(d,ac){
    var dots='',i,pts=[[250,118],[318,92],[196,168],[300,180],[372,146],[236,230],[318,242],[150,214],[386,222],[268,296],[196,284],[352,296],[112,160],[420,176],[470,110],[70,250]];
    for(i=0;i<pts.length;i++){
      var inZone=Math.sqrt(Math.pow(pts[i][0]-268,2)+Math.pow(pts[i][1]-206,2))<112;
      dots+='<circle cx="'+pts[i][0]+'" cy="'+pts[i][1]+'" r="'+(inZone?5:3.6)+'" fill="'+(inZone?ac:'currentColor')+'" opacity="'+(inZone?'1':'.28')+'"/>';
    }
    return '<svg viewBox="0 0 536 340" preserveAspectRatio="xMidYMid meet" style="color:currentColor">'
      +'<path d="M40 70 C 140 40, 200 170, 290 130 S 460 100, 500 30" fill="none" stroke="currentColor" stroke-opacity=".26" stroke-width="1.5" stroke-dasharray="7 7"/>'
      +'<path d="M30 262 C 130 232, 190 322, 300 290 S 460 306, 512 262" fill="none" stroke="currentColor" stroke-opacity=".26" stroke-width="1.5" stroke-dasharray="7 7"/>'
      +'<circle cx="268" cy="206" r="112" fill="'+ac+'" fill-opacity=".10" stroke="'+ac+'" stroke-width="2"/>'
      +'<circle cx="268" cy="206" r="150" fill="none" stroke="currentColor" stroke-opacity=".14" stroke-width="1"/>'
      +dots
      +'<text x="268" y="211" text-anchor="middle" font-size="14" letter-spacing="2" fill="'+ac+'" font-family="inherit">'+d.artA+'</text>'
      +'<text x="512" y="282" text-anchor="end" font-size="11" letter-spacing="1" fill="currentColor" opacity=".55" font-family="inherit">'+d.artB+'</text>'
      +'</svg>';
  }
  function render(){
    var d=C[lang],p=document.getElementById('poster');
    p.className='poster'+(variant==='dark'?'':' '+variant);
    p.innerHTML='<div class="pad">'
      +'<div class="brand"><span>JOHOME</span><span class="nw">'+d.nw+'</span></div>'
      +'<div class="eyebrow">'+d.eyebrow+'</div>'
      +'<h1>'+d.h1.join('<br/>')+'</h1>'
      +'<p class="lead">'+d.lead+'</p>'
      +'<div class="art">'+art(d,ACC[variant])+'</div>'
      +'<div class="sec"><div class="kick">'+d.k1+'</div><h2>'+d.h2a+'</h2><div class="pts">'
      +d.pts.map(function(x){return '<div class="pt"><div class="ic">'+x[0]+'</div><b>'+x[1]+'</b><p>'+x[2]+'</p></div>';}).join('')+'</div></div>'
      +'<div class="sec"><div class="kick">'+d.k2+'</div><h2>'+d.h2b+'</h2><div class="vals">'
      +d.vals.map(function(x,i){return '<div class="val"><div class="n">0'+(i+1)+'</div><div><b>'+x[0]+'</b><p>'+x[1]+'</p></div></div>';}).join('')+'</div></div>'
      +'<div class="cta"><div class="l"><b>'+d.ctaB+'</b><span>'+d.ctaS+'</span></div><div class="go">'+d.go+'</div></div>'
      +'<div class="dis">'+d.dis+'</div>'
      +'</div>';
    document.documentElement.lang=lang;
    document.getElementById('bLang').textContent=lang==='zh'?'EN':'中文';
    fit();
  }
  function fit(){
    var s=Math.min(1,(Math.min(window.innerWidth,900)-28)/540);
    var st=document.getElementById('stage');
    st.style.transform='scale('+s+')';st.style.height=(1200*s)+'px';
  }
  Array.prototype.forEach.call(document.querySelectorAll('.btn[data-v]'),function(b){
    b.onclick=function(){variant=b.getAttribute('data-v');Array.prototype.forEach.call(document.querySelectorAll('.btn[data-v]'),function(x){x.className='btn'+(x===b?' on':'');});render();};
  });
  document.getElementById('bLang').onclick=function(){lang=(lang==='zh'?'en':'zh');render();};
  document.getElementById('bDl').onclick=function(){
    var btn=this,old=btn.textContent,st=document.getElementById('stage'),tr=st.style.transform;
    if(!window.html2canvas){btn.textContent='✕';setTimeout(function(){btn.textContent=old;},1500);return;}
    btn.textContent='…';st.style.transform='scale(1)';
    html2canvas(document.getElementById('poster'),{scale:2,backgroundColor:null,useCORS:true}).then(function(cv){
      var a=document.createElement('a');a.download='johome-lifestyle-zone-poster.png';a.href=cv.toDataURL('image/png');a.click();
      st.style.transform=tr;btn.textContent=old;
    }).catch(function(){st.style.transform=tr;btn.textContent='✕';setTimeout(function(){btn.textContent=old;},1500);});
  };
  window.addEventListener('resize',fit);
  render();
})();
</script>
</body>
</html>
