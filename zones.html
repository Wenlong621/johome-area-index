<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>生活圈索引 · Johome 区域找房</title>
<link rel="stylesheet" href="style.css?v=20260827g"/>
</head>
<body>
<div class="cap"><b>⛳ Johome 区域找房 · 索引原型</b>手机端 · 城市 / 生活圈 / 社区 三级列表索引</div>
<div class="ph"><div class="scr"><div class="sb"><span>9:41</span><span class="ri">📶 🔋</span></div><div class="app">
<div class="hdr"><div class="bar"><a class="bk" href="index.html">←</a><div class="ttl">生活圈索引</div><a class="aiBtn" href="https://wenlong621.github.io/johome-ai-prototype/" target="_blank">✦ AI 帮我选</a></div></div>
<div class="wrap">
  <div class="search"><span class="ic">🔍</span><input id="q" placeholder="搜索生活圈（如 铁道镇 / Metrotown / 学区）"/></div>
  <div class="note"><b>生活圈</b>＝本地人口中的「那一片」：多个相邻 MLS 社区组成、可跨行政市，适合先定住哪一片，再挑具体社区。<br/><em>例：Metrotown 生活圈 ＝ 铁道镇一带，含本拿比南 / 东 19 个社区</em></div>
  <div id="hist"></div>
  <div id="hot"></div>
  <div class="chips" id="cityChips"></div>
  <div class="chips" id="sort"></div>
  <div class="divider"></div>
  <div id="body"></div>
  <div class="foot">生活圈 = 多个 MLS 社区聚合的本地人熟知区域 · 全大温 34 个、覆盖 338 个 MLS 社区（无重叠无遗漏）<br/>数据为原型示意 · 点击卡片进入生活圈详情页（AI 助手）</div>
</div>
</div></div></div>
<script src="data.js?v=20260827g"></script>
<script src="shared.js?v=20260827g"></script>
<script>
(function(){
  var U=window.JHU;
  var state={q:'',city:U.param('city')||'全部',sort:'默认'};
  var SORTS=['默认','价格 ↓','价格 ↑','涨幅 ↓','社区数 ↓'];
  function card(zn){
    var z=JH.ZONES[zn],s=JH.ZSTATS[zn],al=(z.alias||'').split('/')[0];
    var tags=(z.tags||[]).slice(0,3).map(function(t){return '<span>'+t+'</span>';}).join('');
    return '<div class="card" onclick="JHU.open(&quot;zone&quot;,&quot;'+U.esc(zn)+'&quot;)">'+U.img(U.cityImg(z.prim),86)
      +'<div class="cb"><div class="nm">'+zn+(al&&al!==zn?' <span class="al">'+al+'</span>':'')+'</div>'
      +'<div class="tg">'+z.cities.join(' / ')+' · '+z.anchor+'</div><div class="tags">'+tags+'</div>'
      +'<div class="stats"><span class="v">$'+s.med+'万</span><span class="g">+'+s.gain+'%</span><span class="m">'+z.nbs.length+' 个社区 · 在售 '+s.active+'</span></div></div></div>';
  }
  function paint(){
    try{U.histRow(document.getElementById('hist'),'zone',!!state.q||state.city!=='全部',paint);U.hotNames(document.getElementById('hot'),'zone',!!state.q||state.city!=='全部');}catch(e){}
    var prims=['全部'].concat(U.primList()),cc=document.getElementById('cityChips');
    cc.innerHTML=prims.map(function(p){return '<span class="chip'+(state.city===p?' on':'')+'" data-c="'+U.esc(p)+'">'+p+'</span>';}).join('');
    Array.prototype.forEach.call(cc.querySelectorAll('.chip'),function(el){el.onclick=function(){state.city=el.getAttribute('data-c');paint();};});
    var s=document.getElementById('sort');s.innerHTML=SORTS.map(function(x){return '<span class="chip'+(state.sort===x?' on':'')+'" data-s="'+x+'">'+x+'</span>';}).join('');
    Array.prototype.forEach.call(s.querySelectorAll('.chip'),function(el){el.onclick=function(){state.sort=el.getAttribute('data-s');paint();};});
    var zs=U.zonesOfCity(state.city).filter(function(zn){var q=state.q.toLowerCase();if(!q)return true;var z=JH.ZONES[zn];return (zn+' '+(z.alias||'')+' '+z.cities.join(' ')+' '+(z.tags||[]).join(' ')+' '+z.anchor).toLowerCase().indexOf(q)>=0;});
    if(state.sort==='价格 ↓')zs.sort(function(a,b){return JH.ZSTATS[b].med-JH.ZSTATS[a].med;});
    else if(state.sort==='价格 ↑')zs.sort(function(a,b){return JH.ZSTATS[a].med-JH.ZSTATS[b].med;});
    else if(state.sort==='涨幅 ↓')zs.sort(function(a,b){return JH.ZSTATS[b].gain-JH.ZSTATS[a].gain;});
    else if(state.sort==='社区数 ↓')zs.sort(function(a,b){return JH.ZONES[b].nbs.length-JH.ZONES[a].nbs.length;});
    document.getElementById('body').innerHTML=zs.length?('<div class="sec">生活圈 <span class="n">'+zs.length+' 个</span></div><div class="gridZ">'+zs.map(card).join('')+'</div>'):'<div class="empty">没有匹配的生活圈，试试中文别名（如「铁道镇」）</div>';
  }
  document.getElementById('q').oninput=function(){state.q=this.value.trim();paint();};
  paint();
})();
</script>
</body>
</html>
