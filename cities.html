<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>城市索引 · Johome 区域找房</title>
<link rel="stylesheet" href="style.css?v=20260828d"/>
</head>
<body>
<div class="cap" id="cap"></div>
<div class="ph"><div class="scr"><div class="sb"><span>9:41</span><span class="ri">📶 🔋</span></div><div class="app">
<div class="hdr"><div class="bar" id="bar"><a class="bk" href="index.html">←</a><div class="ttl" id="ttl"></div><a class="aiBtn" id="aiBtn" href="https://wenlong621.github.io/johome-ai-prototype/" target="_blank"></a></div></div>
<div class="wrap">
  <div class="search"><span class="ic">🔍</span><input id="q"/></div>
  <div id="hist"></div>
  <div id="hot"></div>
  <div class="stick" id="stick">
    <div class="chips" id="sort"></div>
    <div class="divider"></div>
  </div>
  <div id="body"></div>
  <div class="foot" id="foot"></div>
</div>
</div></div></div>
<script src="i18n.js?v=20260828d"></script>
<script src="data.js?v=20260828d"></script>
<script src="shared.js?v=20260828d"></script>
<script>
(function(){
  var U=window.JHU,I=window.JHI,T=I.t,VAC={'Sunshine Coast':1,'Squamish':1,'Whistler':1};
  document.documentElement.lang=I.LANG;
  document.title=T('城市索引 · Johome 区域找房','Cities · Johome Area Finder');
  document.getElementById('cap').innerHTML=T('<b>⛳ Johome 区域找房 · 索引原型</b>手机端 · 城市 / 生活圈 / 社区 三级列表索引','<b>⛳ Johome Area Finder · index prototype</b>Mobile · City / Lifestyle zone / Neighbourhood three-level index');
  document.getElementById('ttl').textContent=T('城市索引','Cities');
  document.getElementById('aiBtn').textContent=T('✦ AI 帮我选','✦ Ask AI');
  document.getElementById('q').placeholder=T('搜索城市（如 Burnaby / 列治文）','Search cities (e.g. Burnaby)');
  document.getElementById('foot').innerHTML=T('数据为原型示意 · 与 Johome Buying AI 原型同源同口径<br/>图片来自 Wikimedia Commons · 点击卡片进入城市详情页（AI 助手）','Prototype data for illustration · same source and definitions as the Johome Buying AI prototype<br/>Images from Wikimedia Commons · tap a card to open its city page in the AI assistant');
  I.mountToggle(document.getElementById('bar'));
  var SORTS=[[T('默认','Default'),'d'],[T('价格 ↓','Price ↓'),'pd'],[T('价格 ↑','Price ↑'),'pa'],[T('涨幅 ↓','Growth ↓'),'gd'],[T('涨幅 ↑','Growth ↑'),'ga'],[T('在售 ↓','Listings ↓'),'ad']];
  var state={q:'',sort:'d'};
  function cityActive(c){var a=0,k;for(k in JH.ZONES){if(JH.ZONES[k].prim===c)a+=JH.ZSTATS[k].active;}return a;}
  var CITY_ALIAS={'Richmond':'列治文','Burnaby':'本拿比','Surrey':'素里','Vancouver West':'温西','Vancouver East':'温东','West Vancouver':'西温','North Vancouver':'北温','New Westminster':'新西敏','Coquitlam':'高贵林','Port Moody':'满地宝','Langley':'兰里','Delta':'三角洲','Abbotsford':'阿伯茨福德','Mission':'米逊','Chilliwack':'奇利瓦克','Whistler':'惠斯勒','Squamish':'斯阔米什','Sunshine Coast':'阳光海岸'};
  function num(s){return parseFloat((''+s).replace(/[^0-9.]/g,''))||0;}
  function card(name){
    var a=JH.CITYCARD[name];
    return U.bigCard({k:'city',n:name,c:'',img:U.cityImg(name),sub:I.EN?'':(CITY_ALIAS[name]||''),kind:T('城市','City'),tg:I.ctag(a[1]),
      m1v:I.money(a[2]),m1l:T('售出中位价','Median sold'),
      m2v:cityActive(name)+T(' 套',''),m2l:T('在售套数','Active listings'),gain:a[4]});
  }
  function paint(){
    try{U.histRow(document.getElementById('hist'),'city',!!state.q,paint);U.hotNames(document.getElementById('hot'),'city',!!state.q);}catch(e){}
    var s=document.getElementById('sort');
    s.innerHTML=SORTS.map(function(x){return '<span class="chip'+(state.sort===x[1]?' on':'')+'" data-s="'+x[1]+'">'+x[0]+'</span>';}).join('');
    Array.prototype.forEach.call(s.querySelectorAll('.chip'),function(el){el.onclick=function(){state.sort=el.getAttribute('data-s');paint();};});
    var names=Object.keys(JH.CITYCARD).filter(function(n){var q=state.q.toLowerCase();return !q||(n+' '+(CITY_ALIAS[n]||'')+' '+JH.CITYCARD[n][1]+' '+I.ctag(JH.CITYCARD[n][1])).toLowerCase().indexOf(q)>=0;});
    if(state.sort==='pd')names.sort(function(a,b){return num(JH.CITYCARD[b][2])-num(JH.CITYCARD[a][2]);});
    else if(state.sort==='pa')names.sort(function(a,b){return num(JH.CITYCARD[a][2])-num(JH.CITYCARD[b][2]);});
    else if(state.sort==='gd')names.sort(function(a,b){return num(JH.CITYCARD[b][4])-num(JH.CITYCARD[a][4]);});
    else if(state.sort==='ga')names.sort(function(a,b){return num(JH.CITYCARD[a][4])-num(JH.CITYCARD[b][4]);});
    else if(state.sort==='ad')names.sort(function(a,b){return cityActive(b)-cityActive(a);});
    var main=names.filter(function(n){return !VAC[n];}),vac=names.filter(function(n){return VAC[n];});
    var h='';
    if(main.length)h+='<div class="sec">'+T('大温城市','Metro Vancouver cities')+' <span class="n">'+main.length+T(' 个','')+'</span></div><div class="gridN">'+main.map(card).join('')+'</div>';
    if(vac.length)h+='<div class="sec">'+T('度假胜地','Resort towns')+' <span class="n">'+vac.length+T(' 个','')+'</span></div><div class="gridN">'+vac.map(card).join('')+'</div>';
    document.getElementById('body').innerHTML=h||'<div class="empty">'+T('没有匹配的城市','No matching cities')+'</div>';
    U.bindCards(document.getElementById('body'));
  }
  document.getElementById('q').oninput=function(){state.q=this.value.trim();paint();};
  paint();
  U.mountSticky();
})();
</script>
</body>
</html>
